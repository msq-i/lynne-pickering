<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Agent</title>
  <style>
    :root {
      --bg: #ffffff;
      --orb-core: #ff5cc8;
      --orb-edge: #b3138a;
      --text: #1b1d24;
      --muted: #6b7280;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: radial-gradient(120% 120% at 50% 30%, #fff5fb 0%, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
    }

    .orb {
      --scale: 1;
      --glow: 40px;
      appearance: none;
      border: none;
      padding: 0;
      cursor: pointer;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #ffd6f0 0%, var(--orb-core) 35%, var(--orb-edge) 100%);
      box-shadow:
        0 0 var(--glow) rgba(255, 92, 200, 0.55),
        inset 0 0 40px rgba(255, 255, 255, 0.15);
      transform: scale(var(--scale));
      transition: box-shadow 120ms ease, transform 120ms ease, filter 200ms ease;
      outline: none;
      position: relative;
      animation: breathe 4s ease-in-out infinite;
    }

    .orb:focus-visible {
      box-shadow:
        0 0 var(--glow) rgba(255, 92, 200, 0.55),
        inset 0 0 40px rgba(255, 255, 255, 0.15),
        0 0 0 4px rgba(255, 92, 200, 0.4);
    }

    /* Halo ring used for listening + connecting */
    .orb::after {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      border: 2px solid rgba(255, 92, 200, 0.45);
      opacity: 0;
      transform: scale(0.9);
    }

    /* --- State-driven visuals --- */
    .orb[data-state="connecting"] {
      animation: none;
      filter: saturate(0.7) brightness(0.9);
    }
    .orb[data-state="connecting"]::after {
      opacity: 1;
      animation: ring 1.4s ease-out infinite;
    }

    .orb[data-state="listening"] {
      animation: none;
    }
    .orb[data-state="listening"]::after {
      opacity: 1;
      animation: ring 2s ease-out infinite;
    }

    .orb[data-state="speaking"] {
      animation: none;
      filter: brightness(1.15);
    }

    .orb[data-state="error"] {
      animation: none;
      background: radial-gradient(circle at 35% 30%, #ffd9d4 0%, #ff7a6b 35%, #c63a2c 100%);
      box-shadow: 0 0 40px rgba(255, 122, 107, 0.5), inset 0 0 40px rgba(255, 255, 255, 0.15);
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); box-shadow: 0 0 36px rgba(255,92,200,0.45), inset 0 0 40px rgba(255,255,255,0.15); }
      50%      { transform: scale(1.04); box-shadow: 0 0 56px rgba(255,92,200,0.6), inset 0 0 40px rgba(255,255,255,0.15); }
    }

    @keyframes ring {
      0%   { opacity: 0.7; transform: scale(0.92); }
      100% { opacity: 0;   transform: scale(1.25); }
    }

    .caption {
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      color: var(--muted);
      min-height: 1.4em;
      text-align: center;
      padding: 0 1rem;
      max-width: 30rem;
    }

    @media (prefers-reduced-motion: reduce) {
      .orb,
      .orb::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <button id="orb" class="orb" data-state="idle" aria-label="Start conversation"></button>
  <p id="caption" class="caption">Click to start</p>

  <script type="module">
    import { Conversation } from "https://esm.sh/@elevenlabs/client";

    // --- Config -------------------------------------------------------------
    // Paste your public ElevenLabs agent ID here, or pass ?agent=... in the URL.
    const AGENT_ID = "agent_5801kssjr261etmb06exam9at88x";

    const agentId =
      (AGENT_ID && AGENT_ID !== "PASTE_YOUR_AGENT_ID_HERE")
        ? AGENT_ID
        : new URLSearchParams(location.search).get("agent");

    // --- Elements -----------------------------------------------------------
    const orb = document.getElementById("orb");
    const caption = document.getElementById("caption");

    // --- State --------------------------------------------------------------
    let conversation = null;
    let state = "idle"; // idle | connecting | active(listening|speaking) | error
    let volumeRaf = null;

    const CAPTIONS = {
      idle: "Click to start",
      connecting: "Connecting…",
      listening: "Listening…  ·  tap to end",
      speaking: "Speaking…  ·  tap to end",
      error: "",
    };

    function render(visualState, message) {
      orb.dataset.state = visualState;
      caption.textContent = message ?? CAPTIONS[visualState] ?? "";
      orb.setAttribute(
        "aria-label",
        visualState === "idle" ? "Start conversation" : "End conversation"
      );
    }

    function setState(next, message) {
      state = next;
      render(next, message);
    }

    // --- Speaking animation: pulse the orb with the agent's output volume ---
    function startVolumeLoop() {
      if (typeof conversation?.getOutputVolume !== "function") return; // CSS fallback
      const tick = () => {
        const v = Math.min(1, Math.max(0, conversation.getOutputVolume() || 0));
        orb.style.setProperty("--scale", (1 + v * 0.18).toFixed(3));
        orb.style.setProperty("--glow", `${Math.round(40 + v * 70)}px`);
        volumeRaf = requestAnimationFrame(tick);
      };
      volumeRaf = requestAnimationFrame(tick);
    }

    function stopVolumeLoop() {
      if (volumeRaf) cancelAnimationFrame(volumeRaf);
      volumeRaf = null;
      orb.style.removeProperty("--scale");
      orb.style.removeProperty("--glow");
    }

    // --- Conversation lifecycle --------------------------------------------
    async function start() {
      if (!agentId) {
        setState("error", "No agent ID set. Add it in index.html or use ?agent=YOUR_ID");
        return;
      }
      setState("connecting");
      try {
        conversation = await Conversation.startSession({
          agentId,
          onConnect: () => setState("listening"),
          onDisconnect: () => {
            stopVolumeLoop();
            conversation = null;
            setState("idle");
          },
          onError: (msg) => {
            stopVolumeLoop();
            conversation = null;
            setState("error", typeof msg === "string" ? msg : "Something went wrong. Tap to retry.");
          },
          onModeChange: ({ mode }) => {
            if (state === "connecting") return; // wait for onConnect
            if (mode === "speaking") {
              setState("speaking");
              startVolumeLoop();
            } else {
              stopVolumeLoop();
              setState("listening");
            }
          },
        });
      } catch (err) {
        conversation = null;
        const denied = err && (err.name === "NotAllowedError" || /permission|denied/i.test(String(err.message || err)));
        setState("error", denied
          ? "Microphone access is needed. Allow it and tap to retry."
          : "Couldn't start the conversation. Tap to retry.");
      }
    }

    async function stop() {
      const c = conversation;
      conversation = null;
      stopVolumeLoop();
      setState("idle");
      try { await c?.endSession(); } catch (_) { /* already closed */ }
    }

    orb.addEventListener("click", () => {
      if (state === "idle" || state === "error") {
        start();
      } else if (state === "connecting") {
        // ignore clicks while connecting to avoid double sessions
      } else {
        stop();
      }
    });
  </script>
</body>
</html>
